<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>💖 Муркакоин | Аниме-кликер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #1a0b2e 0%, #2d1b4e 45%, #4b1a5e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Comic Neue', cursive, sans-serif;
      padding: 1rem;
    }
    .game-container {
      max-width: 750px;
      width: 100%;
      background: rgba(255, 240, 255, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 25px 45px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,180,230,0.4);
      border: 2px solid rgba(255,140,200,0.5);
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
    }
    .clicker-area {
      flex: 1 1 280px;
      background: rgba(0,0,0,0.25);
      border-radius: 2.5rem;
      padding: 1.5rem;
      text-align: center;
      box-shadow: inset 0 0 25px rgba(255,160,210,0.5);
      border: 1px solid rgba(255,200,225,0.5);
    }
    .girl-wrapper {
      cursor: pointer;
      display: inline-block;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 0 12px #ff88cc) drop-shadow(0 8px 18px black);
      -webkit-tap-highlight-color: transparent;
    }
    .girl-wrapper:active { transform: scale(0.92); }
    .stats {
      color: #fff0f8;
      background: rgba(0,0,0,0.5);
      border-radius: 2rem;
      padding: 0.8rem 1.5rem;
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .shop {
      flex: 1 1 280px;
      background: rgba(255,220,240,0.12);
      border-radius: 2.5rem;
      padding: 1.5rem;
      color: white;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,180,220,0.6);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .shop h2 {
      text-align: center;
      font-size: 2rem;
      color: #ffb3e6;
      text-shadow: 0 0 10px magenta;
    }
    .upgrade-btn {
      background: #b44d8c;
      border: none;
      padding: 0.9rem;
      border-radius: 2rem;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 5px 0 #6e2d5c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .upgrade-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #6e2d5c; }
    .upgrade-btn:disabled { opacity: 0.5; transform: none; box-shadow: 0 3px 0 #6e2d5c; cursor: not-allowed; }
    .reset-btn {
      background: #353535;
      border: none;
      padding: 0.7rem;
      border-radius: 2rem;
      color: #ddd;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    /* Аниме-девушка CSS */
    .girl-figure {
      position: relative;
      width: 160px;
      height: 250px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hair-back { position: absolute; width: 110px; height: 130px; background: #2d1538; border-radius: 50% 50% 40% 40%; top: -20px; left: 25px; z-index: 0; }
    .head { position: relative; width: 90px; height: 95px; background: #fde2d3; border-radius: 50%; z-index: 2; margin-top: 10px; box-shadow: 0 4px 8px black; }
    .bangs { position: absolute; width: 100px; height: 45px; background: #2d1538; border-radius: 50% 50% 30% 30%; top: -10px; left: -5px; z-index: 3; }
    .hair-left, .hair-right { position: absolute; width: 22px; height: 75px; background: #2d1538; border-radius: 0 0 15px 15px; top: 25px; z-index: 1; }
    .hair-left { left: -14px; transform: rotate(-8deg); }
    .hair-right { right: -14px; transform: rotate(8deg); }
    .eyes { position: absolute; top: 35px; left: 0; width: 100%; display: flex; justify-content: center; gap: 18px; z-index: 4; }
    .eye { width: 17px; height: 22px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
    .pupil { width: 11px; height: 15px; background: #2b1f5e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .shine { width: 4px; height: 4px; background: white; border-radius: 50%; margin-top: -3px; margin-left: -2px; }
    .blush { position: absolute; top: 55px; width: 100%; display: flex; justify-content: center; gap: 35px; z-index: 4; }
    .blush-dot { width: 14px; height: 8px; background: #ffa4b5; border-radius: 50%; opacity: 0.7; }
    .mouth { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); width: 8px; height: 5px; background: #d6405a; border-radius: 0 0 5px 5px; z-index: 4; }
    .body-figure { position: relative; width: 48px; height: 55px; background: white; border-radius: 15px 15px 5px 5px; margin-top: -5px; z-index: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .collar { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 22px; height: 10px; background: #ba2d4b; border-radius: 4px; }
    .skirt { width: 58px; height: 30px; background: #1c3380; border-radius: 5px 5px 15px 15px; margin-top: -3px; z-index: 1; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
    .legs { display: flex; gap: 10px; margin-top: 2px; }
    .leg { width: 14px; height: 40px; background: #ffdbb5; border-radius: 0 0 8px 8px; }
    .shoe { width: 18px; height: 10px; background: #3a2c3b; border-radius: 10px 10px 3px 3px; margin-top: -2px; }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Аниме-девушка и кнопка клика -->
    <div class="clicker-area">
      <div class="girl-wrapper" id="clickArea">
        <div class="girl-figure">
          <div class="hair-back"></div>
          <div class="head">
            <div class="bangs"></div>
            <div class="hair-left"></div>
            <div class="hair-right"></div>
            <div class="eyes">
              <div class="eye"><div class="pupil"><div class="shine"></div></div></div>
              <div class="eye"><div class="pupil"><div class="shine"></div></div></div>
            </div>
            <div class="blush">
              <div class="blush-dot"></div>
              <div class="blush-dot"></div>
            </div>
            <div class="mouth"></div>
          </div>
          <div class="body-figure">
            <div class="collar"></div>
          </div>
          <div class="skirt"></div>
          <div class="legs">
            <div class="leg"><div class="shoe"></div></div>
            <div class="leg"><div class="shoe"></div></div>
          </div>
        </div>
      </div>
      <div class="stats">
        💰 Тонны: <span id="tonCounter">0</span><br>
        ⚡ За клик: <span id="clickPower">1</span>
      </div>
    </div>

    <!-- Магазин улучшений -->
    <div class="shop">
      <h2>✨ Магазин</h2>
      <button class="upgrade-btn" id="upgradeClick">
        <span>+1 тонна за клик</span>
        <span id="clickUpgCost">10</span>💎
      </button>
      <button class="upgrade-btn" id="autoclicker">
        <span>🤖 Автокликер (1/сек)</span>
        <span id="autoUpgCost">50</span>💎
      </button>
      <button class="upgrade-btn" disabled id="prestigeBtn">
        <span>🌟 Супер-бонус (x2 клик)</span>
        <span id="prestigeCost">500</span>💎
      </button>
      <button class="reset-btn" id="resetBtn">🔄 Сброс игры</button>
    </div>
  </div>

  <script>
    // Основные переменные
    let tons = 0;
    let clickPower = 1;
    let autoClickerLevel = 0;
    let autoClickerInterval = null;

    // Цены улучшений
    let clickUpgradeCost = 10;
    let autoUpgradeCost = 50;
    let prestigeCost = 500;
    let prestigeActive = false;

    // Элементы интерфейса
    const tonSpan = document.getElementById('tonCounter');
    const clickPowerSpan = document.getElementById('clickPower');
    const clickArea = document.getElementById('clickArea');

    const upgradeClickBtn = document.getElementById('upgradeClick');
    const clickUpgCostSpan = document.getElementById('clickUpgCost');

    const autoclickerBtn = document.getElementById('autoclicker');
    const autoUpgCostSpan = document.getElementById('autoUpgCost');

    const prestigeBtn = document.getElementById('prestigeBtn');
    const prestigeCostSpan = document.getElementById('prestigeCost');

    const resetBtn = document.getElementById('resetBtn');

    // Обновление отображения
    function updateUI() {
      tonSpan.textContent = Math.floor(tons);
      clickPowerSpan.textContent = clickPower;
      clickUpgCostSpan.textContent = clickUpgradeCost;
      autoUpgCostSpan.textContent = autoUpgradeCost;
      prestigeCostSpan.textContent = prestigeCost;

      // Блокировка кнопок, если не хватает тонн
      upgradeClickBtn.disabled = tons < clickUpgradeCost;
      autoclickerBtn.disabled = tons < autoUpgradeCost;
      prestigeBtn.disabled = tons < prestigeCost;
    }

    // Функция клика (основная)
    function handleClick() {
      tons += clickPower;
      updateUI();
    }

    // Улучшение клика
    function buyClickUpgrade() {
      if (tons >= clickUpgradeCost) {
        tons -= clickUpgradeCost;
        clickPower += 1;
        clickUpgradeCost = Math.floor(clickUpgradeCost * 1.5);
        updateUI();
      }
    }

    // Покупка автокликера
    function buyAutoclicker() {
      if (tons >= autoUpgradeCost) {
        tons -= autoUpgradeCost;
        autoClickerLevel++;
        autoUpgradeCost = Math.floor(autoUpgradeCost * 1.8);
        
        // Перезапуск интервала с новой скоростью
        if (autoClickerInterval) clearInterval(autoClickerInterval);
        if (autoClickerLevel > 0) {
          autoClickerInterval = setInterval(() => {
            tons += autoClickerLevel;
            updateUI();
          }, 1000);
        }
        updateUI();
      }
    }

    // Престиж (супер-бонус)
    function buyPrestige() {
      if (tons >= prestigeCost && !prestigeActive) {
        tons -= prestigeCost;
        prestigeActive = true;
        clickPower *= 2;
        prestigeBtn.disabled = true;
        prestigeBtn.innerHTML = '<span>🌟 Супер-бонус (активен)</span><span>✓</span>';
        updateUI();
      }
    }

    // Сброс игры
    function resetGame() {
      if (confirm('Точно сбросить весь прогресс? Тонны обнулятся.')) {
        tons = 0;
        clickPower = 1;
        autoClickerLevel = 0;
        clickUpgradeCost = 10;
        autoUpgradeCost = 50;
        prestigeCost = 500;
        prestigeActive = false;
        
        if (autoClickerInterval) clearInterval(autoClickerInterval);
        autoClickerInterval = null;
        
        prestigeBtn.disabled = false;
        prestigeBtn.innerHTML = '<span>🌟 Супер-бонус (x2 клик)</span><span id="prestigeCost">500</span>💎';
        updateUI();
      }
    }

    // Привязка событий
    clickArea.addEventListener('click', handleClick);
    upgradeClickBtn.addEventListener('click', buyClickUpgrade);
    autoclickerBtn.addEventListener('click', buyAutoclicker);
    prestigeBtn.addEventListener('click', buyPrestige);
    resetBtn.addEventListener('click', resetGame);

    // Стартовое обновление
    updateUI();
  </script>
</body>
</html>
